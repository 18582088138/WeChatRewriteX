<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
         background: #f3f4f6; }
  .page { width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden;
          position: relative; background: #ffffff; display: flex;
          flex-direction: column; page-break-after: always; }
  .page.cover { background: linear-gradient(150deg, #0f172a 0%, #1e3a8a 100%);
                color: #fff; justify-content: center; padding: {{PAD}}px; }
  .cover .kicker { font-size: 30px; letter-spacing: 6px; color: #93c5fd;
                   margin-bottom: 36px; }
  .cover h1 { font-size: 84px; line-height: 1.25; font-weight: 800; }
  .cover .one-liner { margin-top: 48px; font-size: 36px; line-height: 1.6;
                      color: #cbd5e1; }
  .cover .badge { position: absolute; bottom: {{PAD}}px; left: {{PAD}}px;
                  font-size: 26px; color: #64748b; }
  .page.content { padding: {{PAD}}px; }
  .content .page-title { font-size: 52px; font-weight: 800; color: #0f172a;
                         line-height: 1.3; margin-bottom: 28px;
                         border-left: 12px solid {{ACCENT}}; padding-left: 24px; }
  .content .body { flex: 1; overflow: hidden; }
  .content p { font-size: {{BODY}}px; line-height: 1.85; color: #1f2937;
               margin-bottom: 1.1em; text-align: justify; }
  .content p.quote { color: #475569; border-left: 6px solid #cbd5e1;
                     padding-left: 20px; font-style: italic; }
  .content .img-wrap { display: flex; align-items: center; justify-content: center;
                       flex: 1; }
  .content img { max-width: 100%; max-height: 100%; border-radius: 16px;
                 object-fit: contain; }
  .content .caption { text-align: center; color: #94a3b8; font-size: 26px;
                      margin-top: 18px; }
  .pageno { position: absolute; right: {{PAD}}px; bottom: 40px;
            font-size: 26px; color: #94a3b8; }
</style>
</head>
<body>
{{PAGES}}
<script>
// 溢出自动适配：逐页缩小正文字号直到不溢出或到下限
(function () {
  var minFont = {{MINFONT}};
  document.querySelectorAll('.page.content .body').forEach(function (body) {
    var size = {{BODY}};
    while (body.scrollHeight > body.clientHeight && size > minFont) {
      size -= 2;
      body.querySelectorAll('p').forEach(function (p) {
        p.style.fontSize = size + 'px';
      });
    }
    body.dataset.fontPx = size;
    body.dataset.overflow = (body.scrollHeight > body.clientHeight) ? '1' : '0';
  });
})();
</script>
</body>
</html>
