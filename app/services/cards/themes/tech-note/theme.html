<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  /* 编辑部快报：纸面/墨色/朱红。纯色域、大字号、无渐变无阴影（taste 规范）。 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
         background: #e9e6df; }
  .page { width: {{WIDTH}}px; height: {{HEIGHT}}px; overflow: hidden;
          position: relative; background: {{PAPER}}; display: flex;
          flex-direction: column; page-break-after: always; }

  /* —— 封面：整版墨色域 —— */
  .cover { background: {{INK}}; color: #F5F2EA; padding: {{PAD}}px;
           justify-content: space-between; }
  .cover-top { display: flex; justify-content: space-between; align-items: center; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 28px;
           letter-spacing: 2px; color: #B9B4A9; }
  .brand-mark { width: 22px; height: 22px; background: {{ACCENT}}; }
  .cover-logo { width: 132px; height: 132px; border-radius: 50%; }
  .cover-mid { margin: 60px 0; }
  .cover-kicker { display: inline-block; background: {{ACCENT}}; color: #fff;
                  font-size: 26px; letter-spacing: 4px; padding: 10px 22px;
                  margin-bottom: 44px; }
  .cover h1 { font-size: 92px; line-height: 1.18; font-weight: 800;
              letter-spacing: -0.02em; max-height: 4.72em; overflow: hidden; }
  .cover .one-liner { font-size: 36px; line-height: 1.7; color: #B9B4A9;
                      margin-top: 44px; max-width: 90%; }
  .cover-bottom { display: flex; justify-content: space-between; align-items: flex-end;
                  border-top: 1px solid #3A382F; padding-top: 32px; }
  .chips { display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { font-size: 24px; color: #B9B4A9; border: 1px solid #3A382F;
          padding: 8px 18px; border-radius: 999px; }
  .cover-total { font-size: 24px; color: #8A8577; }

  /* —— 内容页：纸面 —— */
  .content { padding: {{PAD}}px; }
  .sec-head { display: flex; align-items: flex-start; gap: 22px; margin-bottom: 36px; }
  .sec-no { background: {{ACCENT}}; color: #fff; font-size: 30px; font-weight: 700;
            padding: 6px 14px; margin-top: 14px; }
  .sec-title { font-size: 56px; font-weight: 800; color: {{INK}}; line-height: 1.3;
               letter-spacing: -0.01em; max-height: 2.7em; overflow: hidden; }
  .body { flex: 1; overflow: hidden; }
  .body p { font-size: {{BODY}}px; line-height: 1.9; color: #2A2926;
            margin-bottom: 1.15em; text-align: justify; }
  .body p.quote { border-left: 8px solid {{ACCENT}}; padding-left: 28px;
                  color: #4A463D; font-size: {{BODY}}px; }
  .foot { display: flex; justify-content: space-between; align-items: center;
          border-top: 1px solid #E5E1D8; padding-top: 24px; margin-top: 24px; }
  .foot .logo { font-size: 24px; color: #8A8577; letter-spacing: 1px; }
  .pageno { font-size: 24px; color: #8A8577; font-variant-numeric: tabular-nums; }

  /* 末页品牌区参与布局，预留高度后再自动缩正文。 */
  .body { min-height: 0; }
  .brand-footer { display: flex; flex-shrink: 0; align-items: center;
                  justify-content: center; gap: 20px; padding-top: 20px;
                  font-size: 28px; color: #8A8577; letter-spacing: 3px; }
  .brand-footer .brand-footer-logo { width: 64px; height: 64px; border-radius: 50%; }
  .imgpage.last-page .page-image { flex: 1; min-height: 0; height: auto; }
  .imgpage.last-page .capband { position: static; flex-shrink: 0; }
  .imgpage.last-page .brand-footer { padding: 20px {{PAD}}px; background: {{PAPER}}; }

  /* —— 正文内嵌插图（段落之间，不单独占页） —— */
  .fig { margin: 0.4em 0 1.15em; }
  .fig img { width: 100%; height: auto; max-height: 46vh;
             object-fit: contain; object-position: center; display: block; }
  .fig-cap { font-size: 24px; color: #8A8577; text-align: center; margin-top: 12px; }

  /* —— 图片页 —— */
  .imgpage { padding: 0; }
  .imgpage img { width: 100%; height: 100%;
                  object-fit: contain; object-position: center; display: block;
                  background: {{PAPER}}; }
  .imgpage .capband { position: absolute; left: 0; right: 0; bottom: 0;
                      background: {{INK}}; color: #F5F2EA; padding: 30px {{PAD}}px;
                      font-size: 28px; line-height: 1.5; }
  .imgpage .capband .credit { color: #8A8577; font-size: 22px; margin-top: 8px; }
</style>
</head>
<body>
{{PAGES}}
<script>
// 溢出自动适配：正文逐页缩字号；封面标题超长时降字号保 4 行内完整显示
(function () {
  var minFont = {{MINFONT}};
  document.querySelectorAll('.page.content .body').forEach(function (body) {
    var size = {{BODY}};
    while (body.scrollHeight > body.clientHeight && size > minFont) {
      size -= 2;
      body.querySelectorAll('p').forEach(function (p) { p.style.fontSize = size + 'px'; });
    }
    body.dataset.fontPx = size;
    body.dataset.overflow = (body.scrollHeight > body.clientHeight) ? '1' : '0';
  });
  var h1 = document.querySelector('.cover h1');
  if (h1) {
    var t = 92;
    while (h1.scrollHeight > h1.clientHeight + 4 && t > 52) {
      t -= 6;
      h1.style.fontSize = t + 'px';
    }
  }
})();
</script>
</body>
</html>
