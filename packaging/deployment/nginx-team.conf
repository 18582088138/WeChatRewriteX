# Template only. Replace server name/certificate paths and run nginx -t on the host.
# Expose this listener only on the approved LAN/private network/public HTTPS path.
server {
    listen 443 ssl;
    server_name wenshu.example.invalid;
    ssl_certificate /etc/wenshu/tls/fullchain.pem;
    ssl_certificate_key /etc/wenshu/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 500m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # All files go through the application ACL. Never add a resource/ alias.
}
